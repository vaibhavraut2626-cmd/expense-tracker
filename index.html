<!DOCTYPE html>
<html>
<head>
    <title>Personal Expense Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            margin: 80px auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #aaa;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            font-size: 16px;
        }

        a {
            display: block;
            margin-top: 18px;
            color: #222;
        }
    </style>
</head>

<body>

<div class="container">

    <h1> Expense Tracker</h1>

    <input type="email" placeholder="Enter Email">

    <input type="password" placeholder="Enter Password">

    <button>Login</button>

    <a href="register.html">Create New Account</a>

</div>

</body>
</html>
